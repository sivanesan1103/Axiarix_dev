# Local development infrastructure for Axiarix.
# Host ports are deliberately non-default to avoid clashing with other local services
# (macOS AirPlay occupies :5000, many machines already run Postgres on :5432).
name: axiarix

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axiarix
      POSTGRES_PASSWORD: axiarix_dev_only
      POSTGRES_DB: axiarix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiarix -d axiarix"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible private object storage for evidence and reports.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: axiarix
      MINIO_ROOT_PASSWORD: axiarix_dev_only_secret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - miniodata:/data

  # Development SMTP sink – captures outgoing notification e-mail (UI on :8025).
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
